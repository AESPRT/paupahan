services:
  paupahan-app:
    build: .
    container_name: paupahan_app
    restart: always
    ports:
      - "3070:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://aedev_admin:admin123@fold_go_postgres:5432/paupahan_db?schema=public
      - NEXT_PUBLIC_API_URL=https://api.aesprt.com
    networks:
      - foldgo-api_default
      - default

networks:
  foldgo-api_default:
    external: true
